<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
<div class="calculator">
    <div class="screen">
        <input type="text" value="210 + 10 =" readonly>
        <input type="text" value="270" readonly>
    </div>


    <!-- start of the two buttons -->
     <div class="topbutton">
        <button type="button">CLEAR</button>
        <button type="button">DELETE</button>
     </div>
  
     <!-- end of button -->

     <!-- Start of number buttons -->
    <div class="row">
        <div class="col-one">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>÷</button>
        </div>
    </div>

    <div class="row">
        <div class="col-one">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
        </div>
    </div>

    <div class="row">
        <div class="col-one">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
        </div>
    </div>

    <div class="row">
        <div class="col-one">
            <button>.</button>
            <button>0</button>
            <button>=</button>
            <button>+</button>
        </div>
    </div>

      <!-- end of number buttons -->
 </div>
   
</body>
</html>
